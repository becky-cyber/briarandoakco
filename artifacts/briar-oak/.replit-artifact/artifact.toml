kind = "web"
previewPath = "/"
title = "Briar & Oak Co."
version = "1.0.0"
id = "artifacts/briar-oak"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24583

[services.development]
run = "pnpm --filter @workspace/briar-oak run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/briar-oak", "run", "build" ]
publicDir = "artifacts/briar-oak/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24583"
BASE_PATH = "/"
